name: Temporary Lua 5.0.2 check

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  lua50:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Outfitter
        uses: actions/checkout@v4
      - name: Build verified Lua 5.0.2 compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/lua-5.0.2.tar.gz https://www.lua.org/ftp/lua-5.0.2.tar.gz
          echo "a6c85d85f912e1c321723084389d63dee7660b81b8292452b190ea7190dd73bc  /tmp/lua-5.0.2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/lua-5.0.2.tar.gz -C /tmp
          V=/tmp/lua-5.0.2
          cc -O2 -fcommon -DLUA_OPNAMES \
            -I"$V/include" -I"$V/src" \
            "$V/src/lapi.c" "$V/src/lcode.c" "$V/src/ldebug.c" "$V/src/ldo.c" \
            "$V/src/ldump.c" "$V/src/lfunc.c" "$V/src/lgc.c" "$V/src/llex.c" \
            "$V/src/lmem.c" "$V/src/lobject.c" "$V/src/lopcodes.c" "$V/src/lparser.c" \
            "$V/src/lstate.c" "$V/src/lstring.c" "$V/src/ltable.c" "$V/src/ltm.c" \
            "$V/src/lundump.c" "$V/src/lvm.c" "$V/src/lzio.c" \
            "$V/src/lib/lauxlib.c" "$V/src/luac/luac.c" "$V/src/luac/print.c" \
            -lm -o /tmp/luac50
          /tmp/luac50 -v
      - name: Run real Lua 5.0.2 compiler check
        shell: bash
        run: |
          set -euo pipefail
          for file in OutfitterClassicAPI.lua Outfitter.lua OutfitterStrings.lua OutfitterStrings_de.lua OutfitterStrings_fr.lua OutfitterStrings_cn.lua OutfitterStrings_tw.lua OutfitterStrings_kr.lua; do
            /tmp/luac50 -p -- "$file"
          done
          echo "Lua 5.0.2 syntax check passed: 8 file(s)."
