name: Temporary Lua 5.0.3 check

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  lua503:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Outfitter
        uses: actions/checkout@v4
      - name: Run canonical Lua 5.0.3 compiler check
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lua50/check_lua50.sh \
            Outfitter.lua \
            locales/enUS.lua \
            locales/deDE.lua \
            locales/frFR.lua \
            locales/zhCN.lua \
            locales/zhTW.lua \
            locales/koKR.lua
